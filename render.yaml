# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: philadelphia-crime-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir dashboard app:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
